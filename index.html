<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive MuJoCo robot joint and contact inspector" />
    <title>mjplay · robot contact inspector</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #090d16; color: #ecf2ff; }
      button, input { font: inherit; }
      #app { position: fixed; inset: 0; }
      .brand { position: fixed; top: 22px; left: 24px; z-index: 2; pointer-events: none; }
      .brand h1 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
      .brand p { margin: 4px 0 0; color: #8492aa; font-size: 12px; }
      .panel { position: fixed; z-index: 3; top: 20px; right: 20px; bottom: 20px; width: min(340px, calc(100vw - 40px)); display: flex; flex-direction: column; background: rgba(15, 21, 34, .91); border: 1px solid #26344c; border-radius: 16px; box-shadow: 0 18px 60px rgba(0,0,0,.42); backdrop-filter: blur(16px); overflow: hidden; }
      .panel header { padding: 18px 18px 14px; border-bottom: 1px solid #26344c; }
      #status { font-size: 14px; font-weight: 700; color: #b9ccff; }
      #status.error { color: #ff6f83; }
      #modelStats, #modeText { margin-top: 4px; font-size: 11px; color: #74829a; }
      .toolbar { display: grid; grid-template-columns: 1fr 1fr auto; gap: 7px; margin-top: 14px; }
      button { border: 1px solid #30405d; color: #a9b5c9; background: #182237; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
      button:hover { background: #22304b; }
      button.active { color: white; background: #315dc5; border-color: #4e7bea; }
      .section-title { padding: 13px 18px 7px; color: #7f8da4; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      #joints { overflow: auto; padding: 0 18px 14px; }
      .joint { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 9px 0; border-bottom: 1px solid rgba(49,65,91,.55); font-size: 12px; }
      .joint output { color: #8eaefb; font-variant-numeric: tabular-nums; }
      .joint input { grid-column: 1 / -1; width: 100%; accent-color: #5d87f4; }
      .joint input:disabled { opacity: .38; }
      .readout { margin-top: auto; padding: 13px 18px 16px; border-top: 1px solid #26344c; background: rgba(8,12,21,.48); }
      .metrics { display: flex; justify-content: space-between; color: #8492aa; font-size: 11px; }
      .metrics strong { color: #eaf0ff; font-variant-numeric: tabular-nums; }
      #ncon.hot { color: #ff4d68; }
      #contacts { min-height: 30px; margin-top: 8px; white-space: pre-line; color: #718097; font: 10px/1.45 ui-monospace, monospace; }
      @media (max-width: 650px) { .brand { display: none; } .panel { top: auto; height: 48vh; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="brand"><h1>mjplay</h1><p>Interactive robot contact inspector</p></div>
    <aside class="panel">
      <header>
        <div id="status">Starting…</div>
        <div id="modelStats">Loading model structure</div>
        <div class="toolbar">
          <button id="poseMode" type="button">Pose</button>
          <button id="simMode" type="button">Simulate</button>
          <button id="reset" type="button">Reset</button>
        </div>
        <div id="modeText">Preparing controls…</div>
      </header>
      <div class="section-title">Joint controls</div>
      <div id="joints"></div>
      <div class="readout">
        <div class="metrics"><span>Simulation <strong id="time">0.00s</strong></span><span>Contacts <strong id="ncon">0</strong></span></div>
        <div id="contacts">No active contacts</div>
      </div>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
